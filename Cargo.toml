[package]
name = "pillowguard"
version = "0.3.9"
edition = "2021"
description = "Local-first bedside sitting-up monitoring and caregiver notifications"
repository = "https://github.com/DumKing/pillowguard"

[[bin]]
name = "pillowguard"
path = "src/main.rs"

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build"]

[dependencies]
anyhow = "1"
hmac = "0.12"
sha2 = "0.10"
axum = "0.8"
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "download-binaries"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tauri = { version = "2.10", optional = true }

[build-dependencies]
tauri-build = { version = "2.5", optional = true }
