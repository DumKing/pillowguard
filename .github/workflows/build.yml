name: Rust platform checks
on:
  push:
  workflow_dispatch:
jobs:
  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/ui-contract.cjs
      - run: node tests/alert-capture-ui.cjs
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --locked
  desktop-check:
    # Compile UI integration without downloading/copying installer-only assets.
    # Packaging scripts supply the real model and platform FFmpeg separately.
    env:
      TAURI_CONFIG: '{"bundle":{"resources":[]}}'
    strategy:
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --features desktop --locked
